name: Social media autopost

# Publishes posts from posts/queue.yml when their date arrives.
# Each platform is used only if its secrets are set (see posts/README.md).

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, don't post"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths: ["posts/queue.yml"]

permissions:
  contents: write

concurrency:
  group: social-media-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml requests

      - name: Publish due posts
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POST_TIMEZONE: America/Moncton
          # LinkedIn
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          # Facebook Page
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          # X (Twitter)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Bluesky
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/social_post.py

      - name: Save posting results
        if: always()
        run: |
          if git diff --quiet posts/queue.yml; then
            echo "Nothing new posted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add posts/queue.yml
          git commit -m "Record published social posts [skip ci]"
          git push
